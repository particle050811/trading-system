# 一键启动：docker compose up --build
# 启动后访问 http://localhost:8080
# 默认种子用户：root/123456、alice/alice、bob/bob（见 back-end/src/config.ts）
services:
  backend:
    build:
      context: ./back-end
    environment:
      # 显式留 development，让 config.ts 里的种子用户生效，方便首次体验。
      NODE_ENV: development
      JWT_SECRET: dev-secret-change-me
      PORT: "3000"
    expose:
      - "3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./front-end
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
